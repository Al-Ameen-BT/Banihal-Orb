# ─────────────────────────────────────────────────────────────────────────────
# B2B-Site — nginx config for the CONTAINERIZED deployment (deploy/podman).
#
# This is deploy/nginx/b2b-site.conf with ONE class of change: the proxy targets.
# The bare-metal file is kept as-is and still installed at /etc/nginx/ — it is the
# rollback, and it has to stay valid until the cutover is confirmed.
#
# Installed to /etc/b2b/nginx/b2b-site.conf and bind-mounted read-only into the
# nginx container at /etc/nginx/conf.d/default.conf.
#
# ── Why the upstreams name `b2b-app` and not `b2b-api` / `b2b-web` ──
# b2b-api and b2b-web are two containers in ONE pod, so they share a single
# network namespace and a single address; they are distinguished only by port.
# Podman's DNS registers the POD on the network, so `b2b-app` is the name that
# resolves. Using the container names here works by accident at best.
#
# ── The trust-proxy dependency ──
# On bare metal nginx reached the API over loopback. It now arrives from this
# container's address on the b2b network (10.89.10.0/24), so the API's
# TRUST_PROXY must name that subnet. Leave it at the 'loopback' default and
# Express ignores X-Forwarded-For — every IP-keyed rate limiter then collapses
# into a single bucket keyed on this container, silently.
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolved once at startup. If the app pod is recreated with a new address, nginx
# keeps the old one cached — `systemctl restart b2b-nginx` after any change to the
# app pod's network identity.
upstream b2b_api { server b2b-app:3001; }
upstream b2b_web { server b2b-app:3000; }

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name _;

    # Bind-mounted read-only from the host; still generated and rotated by
    # deploy/nginx/https-nginx.sh. The server's IP must appear in subjectAltName.
    ssl_certificate     /etc/nginx/ssl/b2b-site.crt;
    ssl_certificate_key /etc/nginx/ssl/b2b-site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS stays OFF — see the bare-metal config for the full reasoning: it does
    # nothing on an IP-literal host, and on an internal hostname it removes the
    # browser's "proceed anyway" escape hatch before the self-signed certificate
    # is trusted, turning a warning into a hard lockout.

    # multer accepts 5 files x 10 MB (server/src/modules/ticketing/uploads.ts), so
    # one create-ticket upload can approach 50 MB. Below that, nginx returns 413
    # before the API sees the request. Keep in step with the multer limits.
    client_max_body_size 55m;
    client_body_timeout  120s;

    # Declared once at server level. nginx header inheritance is all-or-nothing
    # per directive: add a proxy_set_header inside any location and that location
    # loses ALL of these. The locations below set only buffering/cache directives
    # so this stays safe.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Assistant chat — Server-Sent Events ───────────────────────────────────
    # EXACT match: POST /api/chat is the only streaming endpoint (/api/chat/sessions*
    # is ordinary JSON and falls through to /api below), and it goes STRAIGHT to the
    # API, deliberately bypassing the Next Route Handler.
    #
    # Do not repoint this at the web upstream. The Route Handler fetches
    # ${NEXT_PUBLIC_API_URL}/api/chat, which is this server's own origin — so
    # nginx -> web -> handler -> nginx -> web is an infinite proxy loop that ends
    # only when workers run out of connections.
    #
    # Buffering off or the assistant appears frozen; gzip off because compressing
    # a stream re-buffers it and stalls SSE just as effectively.
    location = /api/chat {
        proxy_pass http://b2b_api;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # ── AD credential ingest — API-key auth, not a session ────────────────────
    location /api/ad-ingest {
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://b2b_api;
    }

    # ── API ───────────────────────────────────────────────────────────────────
    # No trailing slash on either side, so the full /api/... URI passes through
    # unchanged — Express mounts its routes under /api (server/src/app.ts).
    location /api {
        proxy_pass http://b2b_api;
    }

    # Unauthenticated health probe, mounted at the API root (not under /api).
    location = /health {
        proxy_pass http://b2b_api;
        access_log off;
    }

    # ── Next.js build assets ──────────────────────────────────────────────────
    # Content-hashed filenames: cache hard and forever. proxy_hide_header first
    # because add_header APPENDS — without it the response carries Cache-Control
    # twice.
    location /_next/static/ {
        proxy_pass http://b2b_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    # `no-cache` means "revalidate before reusing", not "do not store". It is
    # required: HTML embeds this build's chunk URLs, and /_next/static/ above is
    # served immutable for a year. Without it a browser may reuse a stale document
    # pointing at chunks the new build no longer has — the app then dies on a
    # ChunkLoadError that only a hard refresh clears.
    #
    # proxy_hide_header is NOT optional: Next serves prerendered pages with
    # `s-maxage=31536000, stale-while-revalidate`, and because add_header appends,
    # ours alone would leave both on the response for intermediaries to choose from.
    location / {
        proxy_pass http://b2b_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
