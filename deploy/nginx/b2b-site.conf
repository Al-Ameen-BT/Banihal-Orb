# ─────────────────────────────────────────────────────────────────────────────
# B2B-Site — nginx reverse proxy (single origin)
#
# Install:
#   sudo cp deploy/nginx/b2b-site.conf /etc/nginx/sites-available/b2b-site.conf
#   sudo ln -sf /etc/nginx/sites-available/b2b-site.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default        # the distro welcome page
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or let the installer do all of the above, obtain the certificate, and run the
# full HTTPS checklist:
#   sudo ./deploy/nginx/https-nginx.sh app.example.com --email admin@yourcompany.com
#
# Certificates (only if doing it by hand — run AFTER the :80 block is live so the
# ACME challenge resolves). Use `certonly --webroot`, NOT `--nginx`: the --nginx
# plugin rewrites this file and its edits fight every later change you make here.
#   sudo certbot certonly --webroot -w /var/www/html -d app.example.com
#
# Everything is served from ONE origin on purpose: the browser calls the API at the
# relative path /api, so the httpOnly auth cookie stays first-party and CORS never
# enters the picture. Do not split the app and API across two hostnames — the login
# flow depends on this.
#
# Installing by hand? Replace app.example.com in 4 places below (2x server_name,
# 2x ssl_certificate*). The installer script substitutes them for you.
# ─────────────────────────────────────────────────────────────────────────────

# Correct WebSocket upgrade handling: "upgrade" only when the client asked for it,
# otherwise empty so upstream keep-alive works. A hardcoded `Connection ""` breaks
# WebSockets, and a hardcoded "upgrade" breaks plain keep-alive — this map is the
# only form that is right for both. Must live at http level, which is where
# sites-enabled/* is included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── :80 — ACME challenge + permanent redirect to HTTPS ──────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name app.example.com;

    # Certbot renewals must stay reachable over plain HTTP, so this is matched
    # before the catch-all redirect (^~ beats the regex-free prefix below).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── :443 — the application ──────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    # HTTP/2 — nginx 1.25.1+ form. On OLDER nginx (Ubuntu 22.04 = 1.18,
    # Debian 12 = 1.22) this line is an unknown directive and nginx REFUSES to
    # start: delete it and use `listen 443 ssl http2;` above instead.
    # Check with: nginx -v
    http2       on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app's own security headers come from helmet, but helmet only covers API
    # responses — HSTS has to be terminated here to cover the Next.js pages too.
    # Only add `preload` once you are certain every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ticket attachments: multer accepts 5 files x 10 MB (server/src/modules/ticketing/
    # uploads.ts), so a single create-ticket upload can legitimately approach 50 MB.
    # Set below that and nginx returns 413 before the API ever sees the request.
    # Keep this in step with the multer limits if they change.
    client_max_body_size 55m;
    client_body_timeout  120s;

    # ── Shared proxy headers ──────────────────────────────────────────────────
    # Declared once at server level so every location inherits them. NOTE: nginx
    # inheritance is all-or-nothing per directive — if you ever add a
    # `proxy_set_header` inside a location, that location silently loses ALL of
    # these and you must repeat them there. The locations below deliberately set
    # only buffering/timeout/cache directives so this stays safe.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # The API runs `app.set('trust proxy', 'loopback')`, so it only believes
    # X-Forwarded-For from 127.0.0.1. That means nginx MUST run on the same host as
    # the API — move it to its own box and every rate limiter collapses into one
    # shared bucket keyed on the proxy's IP.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Assistant chat — Server-Sent Events ───────────────────────────────────
    # Replies run on a CPU-only model and stream for 25-90s.
    #
    # EXACT match (`= /api/chat`), for two reasons:
    #   * POST /api/chat is the only streaming endpoint. /api/chat/sessions* are
    #     ordinary JSON and fall through to `location /api` below.
    #   * It sends the stream to the API on :3001 directly, deliberately BYPASSING
    #     the Next.js Route Handler at client/src/app/api/chat/route.ts. That
    #     handler exists to dodge the buffering in next.config's rewrite proxy —
    #     a hop nginx removes anyway by going straight to the API.
    #
    # DO NOT "fix" this by pointing it at :3000. The Route Handler fetches
    # `${NEXT_PUBLIC_API_URL}/api/chat`, and DEPLOYMENT.md sets NEXT_PUBLIC_API_URL
    # to the PUBLIC origin — so nginx -> :3000 -> handler -> nginx -> :3000 is an
    # infinite proxy loop that only ends when a worker runs out of connections.
    # Sending it to :3001 is what keeps that loop impossible.
    #
    # Buffering must be off or nginx holds the whole response and the assistant
    # appears frozen. Both the API (chat.controller.ts) and the Route Handler send
    # `X-Accel-Buffering: no`, but stating it here means the stream survives anyone
    # removing that header. gzip is off because compressing a stream re-buffers it,
    # which stalls SSE just as effectively as proxy_buffering does.
    location = /api/chat {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # ── AD credential ingest — API-key auth, not a session ────────────────────
    # Uncomment and set the source range if your AD automation runs off-host; this
    # endpoint is not protected by the login session, only by a per-bot API key.
    location /api/ad-ingest {
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://127.0.0.1:3001;
    }

    # ── API ───────────────────────────────────────────────────────────────────
    # No trailing slash on either side, so the full /api/... URI is passed through
    # unchanged — the Express app mounts its routes under /api (server/src/app.ts).
    # This bypasses the Next.js rewrite for browser traffic, saving a proxy hop;
    # the rewrite in next.config.js still serves server-side rendering.
    location /api {
        proxy_pass http://127.0.0.1:3001;
    }

    # Unauthenticated health probe, mounted at the root of the API (not under /api).
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    # ── Next.js build assets ──────────────────────────────────────────────────
    # Content-hashed filenames, so they can be cached hard and forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        # Repeating HSTS is NOT redundant: declaring any add_header here discards
        # every add_header inherited from the server block (same all-or-nothing
        # rule as proxy_set_header above), so without this line these responses
        # would silently lose HSTS.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
