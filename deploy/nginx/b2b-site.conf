# ─────────────────────────────────────────────────────────────────────────────
# B2B-Site — nginx reverse proxy, INTERNAL NETWORK / HTTPS with no domain name
#
# Reached by IP (https://172.17.121.200) or an internal hostname. There is no
# public DNS record, so Let's Encrypt cannot issue for this host — ACME proves
# control of a *public* name, and a private RFC1918 address has none. The
# certificate is therefore SELF-SIGNED, generated by the installer with the
# server's IPs and hostnames in subjectAltName.
#
# Install (generates the certificate, installs this file, runs the checklist):
#   sudo ./deploy/nginx/https-nginx.sh                 # auto-detects the LAN IP
#   sudo ./deploy/nginx/https-nginx.sh 172.17.121.200  # or name it explicitly
#
# Browsers will warn until the certificate is trusted on each client machine —
# the installer prints the per-OS steps at the end. Nothing else is needed: a
# self-signed cert gives the same TLS encryption as a public one, the warning is
# purely about *identity* not being vouched for by a third party.
#
# Everything is served from ONE origin on purpose: the browser calls the API at
# the relative path /api, so the httpOnly auth cookie stays first-party and CORS
# never enters the picture. Do not split the app and API across two addresses —
# the login flow depends on this.
# ─────────────────────────────────────────────────────────────────────────────

# Correct WebSocket upgrade handling: "upgrade" only when the client asked for it,
# otherwise empty so upstream keep-alive works. A hardcoded `Connection ""` breaks
# WebSockets, and a hardcoded "upgrade" breaks plain keep-alive — this map is the
# only form that is right for both. Must live at http level, which is where
# sites-enabled/* is included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── :80 — redirect everything to HTTPS ──────────────────────────────────────
# `server_name _` is a catch-all: with no domain, requests arrive with whatever
# Host the client used (an IP, a short hostname, nothing at all), and this has to
# answer to all of them. $host echoes it back so the redirect lands on the same
# address the user typed instead of a name they cannot resolve.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ─── :443 — the application ──────────────────────────────────────────────────
server {
    # HTTP/2 is enabled on the `listen` line, the form EVERY nginx understands.
    # The newer `http2 on;` directive is 1.25.1+ only: on an older build (Ubuntu
    # 22.04 = 1.18, Debian 12 = 1.22, RHEL 9 = 1.20) it is an unknown directive and
    # nginx REFUSES TO START. Written this way the file is safe to install by hand
    # on any version; the installer upgrades it to `http2 on;` when it detects a
    # build new enough to prefer that, which silences the deprecation warning 1.25+
    # emits for this form. Keep BOTH listen lines in step — IPv6 needs it too.
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name _;

    # Self-signed, generated by https-nginx.sh. Regenerate whenever the server's
    # IP changes — the address must appear in the certificate's subjectAltName or
    # browsers reject it outright (a matching Common Name has not been accepted
    # since Chrome 58).
    ssl_certificate     /etc/nginx/ssl/b2b-site.crt;
    ssl_certificate_key /etc/nginx/ssl/b2b-site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is deliberately OFF for this deployment. Two reasons:
    #   1. RFC 6797 does not apply HSTS to IP-literal hosts, so on https://<ip>
    #      it does nothing at all.
    #   2. On an internal *hostname* it is actively harmful before the
    #      certificate is trusted: HSTS removes the browser's "proceed anyway"
    #      escape hatch, so a self-signed cert becomes a hard lockout with no way
    #      through the interstitial.
    # Enable it only once the certificate is installed in every client's trust
    # store AND you reach the app by hostname:
    # add_header Strict-Transport-Security "max-age=31536000" always;
    #
    # ⚠ If you DO uncomment that: `add_header` inheritance is all-or-nothing per
    # block, and `location /` below now sets its own. It would therefore NOT
    # inherit this line — repeat it inside that location too, or HSTS silently
    # covers every path except the app itself.

    # Ticket attachments: multer accepts 5 files x 10 MB (server/src/modules/ticketing/
    # uploads.ts), so a single create-ticket upload can legitimately approach 50 MB.
    # Set below that and nginx returns 413 before the API ever sees the request.
    # Keep this in step with the multer limits if they change.
    client_max_body_size 55m;
    client_body_timeout  120s;

    # ── Shared proxy headers ──────────────────────────────────────────────────
    # Declared once at server level so every location inherits them. NOTE: nginx
    # inheritance is all-or-nothing per directive — if you ever add a
    # `proxy_set_header` inside a location, that location silently loses ALL of
    # these and you must repeat them there. The locations below deliberately set
    # only buffering/timeout/cache directives so this stays safe.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # The API runs `app.set('trust proxy', 'loopback')`, so it only believes
    # X-Forwarded-For from 127.0.0.1. That means nginx MUST run on the same host as
    # the API — move it to its own box and every rate limiter collapses into one
    # shared bucket keyed on the proxy's IP.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Assistant chat — Server-Sent Events ───────────────────────────────────
    # Replies run on a CPU-only model and stream for 25-90s.
    #
    # EXACT match (`= /api/chat`), for two reasons:
    #   * POST /api/chat is the only streaming endpoint. /api/chat/sessions* are
    #     ordinary JSON and fall through to `location /api` below.
    #   * It sends the stream to the API on :3001 directly, deliberately BYPASSING
    #     the Next.js Route Handler at client/src/app/api/chat/route.ts. That
    #     handler exists to dodge the buffering in next.config's rewrite proxy —
    #     a hop nginx removes anyway by going straight to the API.
    #
    # DO NOT "fix" this by pointing it at :3000. The Route Handler fetches
    # `${NEXT_PUBLIC_API_URL}/api/chat`, and NEXT_PUBLIC_API_URL is set to this
    # server's own https:// origin — so nginx -> :3000 -> handler -> nginx ->
    # :3000 is an infinite proxy loop that only ends when a worker runs out of
    # connections. Sending it to :3001 is what keeps that loop impossible.
    #
    # Buffering must be off or nginx holds the whole response and the assistant
    # appears frozen. Both the API (chat.controller.ts) and the Route Handler send
    # `X-Accel-Buffering: no`, but stating it here means the stream survives anyone
    # removing that header. gzip is off because compressing a stream re-buffers it,
    # which stalls SSE just as effectively as proxy_buffering does.
    location = /api/chat {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # ── AD credential ingest — API-key auth, not a session ────────────────────
    # Uncomment and set the source range if your AD automation runs on a different
    # subnet; this endpoint is not protected by the login session, only by a
    # per-bot API key.
    location /api/ad-ingest {
        # allow 10.0.0.0/8;
        # deny  all;
        proxy_pass http://127.0.0.1:3001;
    }

    # ── API ───────────────────────────────────────────────────────────────────
    # No trailing slash on either side, so the full /api/... URI is passed through
    # unchanged — the Express app mounts its routes under /api (server/src/app.ts).
    # This bypasses the Next.js rewrite for browser traffic, saving a proxy hop;
    # the rewrite in next.config.js still serves server-side rendering.
    location /api {
        proxy_pass http://127.0.0.1:3001;
    }

    # Unauthenticated health probe, mounted at the root of the API (not under /api).
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    # ── Next.js build assets ──────────────────────────────────────────────────
    # Content-hashed filenames, so they can be cached hard and forever.
    #
    # Next already sends this exact value itself. `add_header` APPENDS rather than
    # replaces, so without the hide below the response carried the header TWICE —
    # harmless while both copies agree, but it is the same append behaviour that
    # silently breaks `location /`, so keep the two blocks written the same way.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    # `no-cache` means "revalidate before reusing", NOT "do not store" — the browser
    # keeps the document and a 304 costs one cheap round trip (Next sends an etag).
    #
    # It is required, not tidiness. HTML embeds the build's chunk URLs, and
    # /_next/static/ above is served `immutable` for a year. Without a header here a
    # browser is free to reuse a stale document heuristically, and after a redeploy
    # that document points at chunk filenames the new build no longer contains — the
    # app dies on a ChunkLoadError that only a hard refresh clears. Revalidating the
    # HTML is what keeps the immutable asset caching safe.
    #
    # proxy_hide_header is what makes it actually work, and is NOT optional. Next
    # serves prerendered pages with `Cache-Control: s-maxage=31536000,
    # stale-while-revalidate` — a year of shared-cache reuse. Because add_header
    # appends, adding ours alone leaves BOTH on the response and lets every
    # intermediary pick which to honour. Hiding the upstream value first makes ours
    # the only Cache-Control the client ever sees.
    #
    # `always` so it is set on non-2xx/3xx too; the default add_header code set
    # excludes them, and an uncacheable error page is just as important.
    #
    # This also covers App Router RSC payloads: soft navigations re-request the same
    # URLs with an RSC header and land in this same block.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
