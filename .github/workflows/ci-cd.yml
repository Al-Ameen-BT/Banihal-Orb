name: CI

# Syntax / compile checks only — no tests, no deployment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Server — TypeScript type-check (needs the generated Prisma clients for types)
  # ──────────────────────────────────────────────────────────────────────────
  server-check:
    name: Server — typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generates all four Prisma clients (main + chat + ticketing + ticket) so
      # their imports resolve during type-checking. No database is required.
      - name: Generate Prisma clients
        run: npm run db:generate

      - name: TypeScript check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────────────────────
  # Client — TypeScript type-check + production build
  # ──────────────────────────────────────────────────────────────────────────
  client-check:
    name: Client — typecheck & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
