name: CI/CD

on:
  push:
    branches: [main, "dev/**"]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel a superseded run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Product version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check version metadata and release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            node scripts/version.mjs check --tag "$REF_NAME"
          else
            node scripts/version.mjs check
          fi
      - name: Version tooling tests
        run: node scripts/version.test.mjs
  # ──────────────────────────────────────────────────────────────────────────
  # Server — TypeScript type-check + unit tests
  # ──────────────────────────────────────────────────────────────────────────
  server-check:
    needs: version-check
    name: Server — typecheck & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generates all four Prisma clients (main + chat + ticketing + ticket) so
      # their imports resolve during type-checking. No database is required.
      - name: Generate Prisma clients
        run: npm run db:generate

      - name: TypeScript check
        run: npx tsc --noEmit

      # The suite has always existed but was never run here. Note that most of it
      # needs a live PostgreSQL and is expected to fail without one — this step
      # runs the tests that do not, so a broken pure function (cache keys, the
      # dashboard aggregation, request signing) stops a merge.
      #
      # To run the whole suite, add a postgres service container and provision the
      # five databases with db/provision.sh. Until then, do NOT widen this pattern
      # and let the DB-dependent failures turn the pipeline permanently red —
      # a red pipeline nobody trusts is worse than a narrow green one.
      - name: Unit tests
        run: npx vitest run tests/cache.test.ts tests/dashboard-aggregate.test.ts tests/agent-signing.test.ts tests/uploads.test.ts tests/permissions.test.ts tests/security-headers.test.ts tests/machine-protocol-v2.test.ts tests/machineAuth.test.ts tests/squid-agent-hmac.test.ts tests/squid-automation.test.ts tests/squid-control-routes.test.ts tests/squid-dispatch-safety.test.ts tests/squid-human-surface.test.ts tests/squid-acl-engine.test.ts
        # config/env.ts validates the whole environment at IMPORT and calls
        # process.exit(1) when it fails. `.env` is gitignored, so on a runner every
        # test file that transitively imports it dies before a single assertion
        # runs — which is why this step was red from the day it was added.
        #
        # These are placeholders, never connected to. The failure is at import
        # time, not connection time: no test in this list opens a socket. They only
        # have to satisfy the zod schema — .url() for the five DSNs, min(32) for the
        # three secrets.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/b2b_test
          CHAT_DATABASE_URL: postgresql://ci:ci@localhost:5432/b2b_chat_test
          TICKETING_DATABASE_URL: postgresql://ci:ci@localhost:5432/b2b_ticketing_test
          TICKET_DATABASE_URL: postgresql://ci:ci@localhost:5432/b2b_ticket_test
          ADMIN_TICKETING_DATABASE_URL: postgresql://ci:ci@localhost:5432/b2b_ticketing_admin_test
          JWT_ACCESS_SECRET: ci-placeholder-not-a-real-secret-000000000000
          IMPERSONATION_SECRET: ci-placeholder-not-a-real-secret-222222222222

  # ──────────────────────────────────────────────────────────────────────────
  # Client — TypeScript type-check + production build
  # ──────────────────────────────────────────────────────────────────────────
  client-check:
    name: Client — typecheck & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholder only — this build is a compile check, never shipped. The
          # real value is inlined at image build time from /etc/b2b/client.env.
          NEXT_PUBLIC_API_URL: http://localhost:3001

  squid-host:
    name: Squid host package — safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography flask
      - run: python -m unittest discover -s deploy/squid -p 'test_*.py' -v

  # ──────────────────────────────────────────────────────────────────────────
  # Images — prove the Containerfiles still build
  # ──────────────────────────────────────────────────────────────────────────
  # A hosted runner, deliberately: this job only has to catch a broken
  # Containerfile, and doing that on GitHub's infrastructure keeps the failure
  # visible on pull requests, before anything reaches the deploy runner.
  images:
    name: Container images — build
    runs-on: ubuntu-latest
    needs: [server-check, client-check, squid-host]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: podman build -f Containerfile.api -t b2b-api:ci .

      - name: Build web image
        run: |
          podman build -f Containerfile.web \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 \
            -t b2b-web:ci .

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy — main only, on the LAN
  # ──────────────────────────────────────────────────────────────────────────
  # SELF-HOSTED, and it has to be. The target sits on a private LAN with no public
  # DNS and no inbound route (which is also why its TLS certificate is
  # self-signed) — a GitHub-hosted runner cannot reach it at all. The runner lives
  # on the LAN and needs rights to run the Quadlet units:
  #
  #   sudo tee /etc/sudoers.d/b2b-deploy <<'EOF'
  #   github-runner ALL=(root) NOPASSWD: /usr/bin/systemctl restart b2b-api b2b-web b2b-nginx, \
  #                                      /usr/bin/systemctl is-active b2b-api b2b-web b2b-nginx
  #   EOF
  #
  # Scoped to exactly those commands: a runner that can run any systemctl is a
  # runner that can be talked into running anything.
  deploy:
    name: Deploy to internal server
    runs-on: [self-hosted, b2b]
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Attach a GitHub Environment so the deploy can require a manual approval.
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Recorded BEFORE the build so the rollback target is known even if a later
      # step dies partway through.
      #
      # The two images are always built and tagged together, so one sha identifies
      # the pair. Rolling back only the API would leave the web bundle on new code
      # talking to an old API — a mismatch that is worse than either version alone.
      - name: Record current release for rollback
        id: current
        run: |
          prev=$(podman image inspect localhost/b2b-api:latest \
                   --format '{{range .RepoTags}}{{println .}}{{end}}' 2>/dev/null \
                   | grep -v ':latest$' | head -1 | sed 's/.*://' || echo '')
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          echo "Rollback target: ${prev:-<none, first deploy>}"

      - name: Build images
        run: ./deploy/podman/build.sh "${GITHUB_SHA::7}"

      # b2b-nginx is included so it re-resolves the b2b-api / b2b-web upstreams
      # after the app pod is recreated; a stale cached IP here was a ticketing
      # outage cause.
      - name: Restart services
        run: sudo systemctl restart b2b-api b2b-web b2b-nginx

      # The real gate. `systemctl restart` returning 0 only means the container
      # started, not that the app inside it works — a bad DATABASE_URL exits
      # seconds later and systemd cheerfully restarts it forever.
      - name: Health check
        id: health
        run: |
          for i in $(seq 1 30); do
            if curl -fsSk https://localhost/health >/dev/null 2>&1; then
              echo "✅ Healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "❌ Unhealthy after 300s"; exit 1

      - name: Roll back on failure
        if: failure() && steps.health.outcome == 'failure' && steps.current.outputs.previous != ''
        run: |
          prev='${{ steps.current.outputs.previous }}'
          echo "↩️  Rolling back both images to $prev"
          podman tag "localhost/b2b-api:$prev" localhost/b2b-api:latest
          podman tag "localhost/b2b-web:$prev" localhost/b2b-web:latest
          sudo systemctl restart b2b-api b2b-web b2b-nginx
          echo "⚠️  Rolled back. The bad images are still tagged :${GITHUB_SHA::7} for inspection."
