{% extends "base.html" %}
{% block title %}Live Log · Squid Console{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Live Log</h1>
  <span class="muted small mono">{{ access_log }}</span>
</div>

<div class="panel filter-bar">
  <input id="fQ" placeholder="search url / result / user">
  <input id="fClient" placeholder="client IP starts with…">
  <select id="fAction">
    <option value="">allowed + denied</option>
    <option value="denied">denied only</option>
    <option value="allowed">allowed only</option>
  </select>
  <select id="fMethod">
    <option value="">any method</option>
    <option>GET</option><option>POST</option><option>CONNECT</option>
    <option>PUT</option><option>HEAD</option>
  </select>
  <label class="check"><input type="checkbox" id="fAuto" checked> auto-refresh (5s)</label>
  <button class="btn btn-primary" onclick="loadLogs()">Refresh</button>
  <span id="logCount" class="muted small"></span>
</div>

<div class="panel log-panel">
  <table class="log-table">
    <thead>
      <tr><th></th><th>Time</th><th>Client</th><th>Result</th><th>Method</th>
          <th>URL</th><th>User</th><th>Bytes</th></tr>
    </thead>
    <tbody id="logBody">
      <tr><td colspan="8" class="muted">Loading…</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function loadLogs(){
  const p = new URLSearchParams({
    q: document.getElementById('fQ').value,
    client: document.getElementById('fClient').value,
    action: document.getElementById('fAction').value,
    method: document.getElementById('fMethod').value
  });
  try{
    const r = await fetch('/api/logs?' + p);
    const data = await r.json();
    const body = document.getElementById('logBody');
    if (data.error){ body.innerHTML = `<tr><td colspan="8" class="deny">${esc(data.error)}</td></tr>`; return; }
    document.getElementById('logCount').textContent = data.count + ' lines';
    body.innerHTML = data.entries.map(e => `
      <tr class="${e.denied ? 'row-deny' : ''}">
        <td><span class="led ${e.denied ? 'led-red' : 'led-green'}"></span></td>
        <td class="mono">${esc(e.time)}</td>
        <td class="mono">${esc(e.client)}</td>
        <td class="mono ${e.denied ? 'deny' : ''}">${esc(e.result)}</td>
        <td class="mono">${esc(e.method)}</td>
        <td class="mono url">${esc(e.url)}</td>
        <td class="mono">${esc(e.user)}</td>
        <td class="mono num">${esc(e.bytes)}</td>
      </tr>`).join('') || '<tr><td colspan="8" class="muted">No matching lines.</td></tr>';
  }catch(err){
    document.getElementById('logBody').innerHTML =
      `<tr><td colspan="8" class="deny">Fetch failed: ${esc(err.message)}</td></tr>`;
  }
}

let timer = setInterval(maybeRefresh, 5000);
function maybeRefresh(){ if (document.getElementById('fAuto').checked) loadLogs(); }
['fQ','fClient'].forEach(id => document.getElementById(id)
  .addEventListener('input', () => { clearTimeout(window._deb); window._deb = setTimeout(loadLogs, 400); }));
['fAction','fMethod'].forEach(id => document.getElementById(id)
  .addEventListener('change', loadLogs));
loadLogs();
</script>
{% endblock %}
