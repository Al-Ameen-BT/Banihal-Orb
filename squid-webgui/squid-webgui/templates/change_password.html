{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
{% if forced %}
<div class="flash flash-error">You must set a new password before continuing.</div>
{% endif %}
<form method="post" class="panel narrow">
  <label>Current password
    <input type="password" name="current" required autofocus>
  </label>
  <label>New password <span class="muted small">(min 8 characters)</span>
    <input type="password" name="new" required minlength="8">
  </label>
  <label>Repeat new password
    <input type="password" name="again" required minlength="8">
  </label>
  <button class="btn btn-primary">Update password</button>
</form>
{% endblock %}
